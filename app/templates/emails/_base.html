<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}Breneo{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
        <tr>
            <td align="center" style="padding:20px 12px;">
                {% if logo_url %}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
                    <tr>
                        <td align="center" style="padding:12px 24px 24px 24px;">
                            <img src="{{ logo_url }}" alt="Breneo" width="160" height="34" style="display:block; width:160px; max-width:160px; height:auto; border:0; outline:none; text-decoration:none;">
                        </td>
                    </tr>
                </table>
                {% endif %}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#f9f9f9; border-radius:8px;">
                    <tr>
                        <td style="padding:30px 30px 30px 30px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#333333;">
                            <h1 style="margin:0 0 24px 0; font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:1.3; font-weight:bold; color:#222222; text-align:center;">{% block heading %}{% endblock %}</h1>
                            {% block content %}{% endblock %}
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:30px; border-top:1px solid #dddddd;">
                                <tr>
                                    <td align="center" style="padding-top:20px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; color:#666666;">
                                        <p style="margin:0 0 12px 0;">Best regards,<br>The Breneo Team</p>
                                        <p style="margin:0; font-size:11px; color:#999999;">This is an automated message. Please do not reply to this email.</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
